name: Release Novelite

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test

  native-upgrade:
    needs: quality
    uses: ./.github/workflows/native-upgrade.yml

  release-tauri:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: 'macos-15'
            target: aarch64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Windows bootstrap failure handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($scenario in @('cancel', 'success', 'checksum', 'network')) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-installer.ps1 -Scenario $scenario
            if ($LASTEXITCODE -ne 0) { throw "Installer regression failed: $scenario" }
          }

      - name: Test on macOS WebKit
        if: runner.os == 'macOS'
        env:
          TEST_BROWSERS: webkit
        run: |
          npx playwright install webkit
          npm test

      - name: Build native installers
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: node scripts/build-native.mjs --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked

      - name: Verify update signatures and reject tampering
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/verify-updater.mjs

      - name: Verify durable restart checkpoint storage
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} --locked --lib restart_checkpoint::tests

      - name: Verify macOS app and disk image
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/verify-macos.sh

      - name: Verify Homebrew installation and uninstall
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: bash scripts/verify-homebrew.sh

      - name: Verify Windows installers and native startup
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: ./scripts/verify-windows.ps1

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-tauri, native-upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-dist
          merge-multiple: true
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-dist -type f -exec cp {} release-upload/ \;
          test "$(find release-upload -name '*_aarch64.dmg' | wc -l)" -eq 1
          node scripts/generate-updater.mjs release-upload "$TAG"
          (cd release-upload && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Novelite $TAG" --notes-file "docs/releases/$TAG.md"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" release-upload/* --clobber
          gh release edit "$TAG" --draft=false --latest

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update Homebrew to the verified public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*_aarch64.dmg' --dir release-dist
          node scripts/generate-cask.mjs release-dist/*_aarch64.dmg Casks/novelite.rb
          node scripts/sync-homebrew.mjs Casks/novelite.rb "$TAG"
