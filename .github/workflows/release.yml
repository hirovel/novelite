name: Release Novelite

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test

  release-tauri:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: 'macos-15'
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: 'ubuntu-22.04'
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Test on macOS WebKit
        if: runner.os == 'macOS'
        env:
          TEST_BROWSERS: webkit
        run: |
          npx playwright install webkit
          npm test

      - name: Build native installers
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked

      - name: Verify macOS app and disk image
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/verify-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-dist
          merge-multiple: true
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-dist -type f -exec cp {} release-upload/ \;
          test "$(find release-upload -name '*.dmg' | wc -l)" -eq 2
          (cd release-upload && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Novelite $TAG" --notes-file "docs/releases/$TAG.md"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" release-upload/* --clobber
          gh release edit "$TAG" --draft=false --latest
