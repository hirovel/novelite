<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 25 220 220" width="100%" height="100%">
  <style>
    .back-sheet { stroke: #64748b; opacity: 0.7; }
    .front-sheet { stroke: #f8fafc; }
    .fold { fill: #ffffff; stroke: #ffffff; }
    .line-silver { stroke: #cbd5e1; }
    .gold { stroke: #f59e0b; fill: #f59e0b; }

    @media (prefers-color-scheme: light) {
      .back-sheet { stroke: #94a3b8; opacity: 0.85; }
      .front-sheet { stroke: #0f172a; }
      .fold { fill: #0f172a; stroke: #0f172a; }
      .line-silver { stroke: #64748b; }
      .gold { stroke: #d97706; fill: #d97706; }
    }
  </style>
  <!-- Layer 1: Back Under-sheet Outline -->
  <polygon class="back-sheet" points="45,60 135,60 175,100 175,225 45,225" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Layer 2: Front Hero Sheet Outline -->
  <polygon class="front-sheet" points="60,45 150,45 190,85 190,210 60,210" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Layer 3: Folded Corner Triangle -->
  <polygon class="fold" points="150,45 150,85 190,85" stroke-width="2"/>
  
  <!-- Layer 4: Ruling Line 1 -->
  <line class="line-silver" x1="85" y1="135" x2="165" y2="135" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Layer 5: Ruling Line 2 (24K Gold) -->
  <line class="gold" x1="85" y1="165" x2="145" y2="165" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Layer 6: Core Dot (24K Gold) -->
  <circle class="gold" cx="145" cy="165" r="6"/>
</svg>